# Skyramp Workspace Configuration
workspace:
  repoName: chelfimo/directus
  repoUrl: https://github.com/chelfimo/directus
metadata:
  schemaVersion: v1
  mcpVersion: 0.2.6
  executorVersion: v1.3.27
  createdAt: "2026-06-22T14:40:39.194Z"
  updatedAt: "2026-06-22T14:40:39.200Z"
services:
  - serviceName: directus-api-backend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/api
    api:
      schemaPath: http://localhost:8055/server/openapi
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:8055
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.eval.yml up -d --build
      runtime: docker
      dockerNetwork: directus_default
  - serviceName: directus-app-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/app
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8055
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.eval.yml up -d --build
      runtime: docker
      dockerNetwork: directus_default
