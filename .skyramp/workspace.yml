# Skyramp Workspace Configuration
workspace:
  repoName: chelfimo/directus
  repoUrl: https://github.com/chelfimo/directus
metadata:
  schemaVersion: v1
  mcpVersion: 0.2.0-rc.1
  executorVersion: v1.3.24
  createdAt: "2026-06-03T18:41:35.936Z"
  updatedAt: "2026-06-03T18:41:35.943Z"
services:
  - serviceName: directus-api-backend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/api
    api:
      schemaPath: packages/specs/src/openapi.yaml
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:8055
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.eval.yml up -d directus
      runtime: docker
      dockerNetwork: directus_default
  - serviceName: directus-app-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/app
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8055
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.eval.yml up -d directus
      runtime: docker
      dockerNetwork: directus_default
